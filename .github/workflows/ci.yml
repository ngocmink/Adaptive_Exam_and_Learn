name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: exam_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam -d exam_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://exam:ci-test-password@127.0.0.1:5432/exam_dev
      TEST_DATABASE_URL: postgresql+psycopg://exam:ci-test-password@127.0.0.1:5432/exam_test
      SECRET_KEY: ci-ephemeral-secret-key-for-tests-only
      ALLOW_TEST_DB_RESET: "yes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare isolated exam_test database
        run: |
          PGPASSWORD=ci-test-password psql -h 127.0.0.1 -U exam -d exam_dev -c "CREATE DATABASE exam_test;"
          PGPASSWORD=ci-test-password psql -h 127.0.0.1 -U exam -d exam_test -c "CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Syntax check Python and JavaScript
        run: |
          python -m py_compile app/__init__.py app/admin/routes.py app/admin/read_routes.py app/library/routes.py app/common/decorators.py app/common/model_registry.py
          node --check js/admin.js js/quiz.js js/account.js js/auth.js

      - name: Run pytest test suite
        run: pytest -q
