<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ material.title }}</title>
  <style>
    body{font:16px system-ui,sans-serif;margin:0;color:#172033}header{padding:1rem 5%;background:#f4f7fb}
    main{max-width:1000px;margin:2rem auto;padding:0 1rem}iframe{width:100%;height:75vh;border:1px solid #ddd}
  </style>
</head>
<body>
  <header><a href="/account">← Quay lại kho học tập</a></header>
  <main>
    <h1>{{ material.title }}</h1>
    {% if material.description %}<p>{{ material.description }}</p>{% endif %}
    {% if material.file_url %}
      <iframe src="{{ url_for('static', filename=material.file_url) if material.file_url.startswith('pdf/') else material.file_url }}" title="Tài liệu {{ material.title }}"></iframe>
    {% else %}
      <p>Tài liệu chưa có đường dẫn file.</p>
    {% endif %}
  </main>
</body>
</html>
