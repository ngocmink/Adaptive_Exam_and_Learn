<!DOCTYPE html>
<html lang="vi" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Đăng ký | Adaptive Exam and Learn</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='asset/register.css') }}">
  <style>
    .content select { width: 100%; min-height: 45px; padding: 8px 12px; border: 1px solid #ccc; border-bottom-width: 2px; border-radius: 5px; font: inherit; }
    #notice { min-height: 1.5em; color: #9b2350; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Title section -->
    <div class="title">Đăng ký</div>
    <div class="content">
      <!-- Registration form -->
      <form id="register-form" action="/api/auth/register" method="post">
        <div class="user-details">
          <!-- Input for Full Name -->
          <div class="input-box">
            <span class="details">Họ tên</span>
            <input type="text" name="rname" placeholder="Điền họ và tên" autocomplete="name" maxlength="120" required>
          </div>
          <!-- Input for Email -->
          <div class="input-box">
            <span class="details">Email</span>
            <input type="email" name="email" placeholder="Email" autocomplete="email" required>
          </div>
          <!-- Input for Phone Number -->
          <div class="input-box">
            <span class="details">Số điện thoại</span>
            <input type="tel" name="phone" placeholder="Nhập số điện thoại" autocomplete="tel">
          </div>
          <!-- Input for Password -->
          <div class="input-box">
            <span class="details">Mật khẩu</span>
            <input type="password" name="password" placeholder="Nhập mật khẩu" autocomplete="new-password" minlength="6" required>
          </div>
          <!-- Input for Confirm Password -->
          <div class="input-box">
            <span class="details">Xác nhận mật khẩu</span>
            <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <div class="gender-details">
          <span class="gender-title">Phong cách học tập (không bắt buộc)</span>
          <input type="radio" name="study_type" id="dot-1" value="visual">
          <input type="radio" name="study_type" id="dot-2" value="reading">
          <input type="radio" name="study_type" id="dot-3" value="kinesthetic">
          <div class="category">
            <label for="dot-1">
              <span class="dot one"></span>
              <span class="gender">Nghe và nhìn</span>
            </label>
            <label for="dot-2">
              <span class="dot two"></span>
              <span class="gender">Đọc và ghi</span>
            </label>
            <label for="dot-3">
              <span class="dot three"></span>
              <span class="gender">Thực hành</span>
            </label>
          </div>
        </div>
        <!-- Submit button -->
        <div class="button">
          <input type="submit" value="Đăng ký">
        </div>
      </form>
      <p id="notice" role="status" aria-live="polite"></p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
      {% endwith %}
      <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</body>
</html>
